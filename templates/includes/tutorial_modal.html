{% load static %}
<!-- ============================================================================== -->
<!-- MODAL DE TUTORIAL INTERACTIVO Y GUÍA DEL SISTEMA • SGR LA SERENA -->
<!-- ============================================================================== -->
<div class="modal fade" id="modalTutorialSGR" tabindex="-1" aria-labelledby="modalTutorialSGRLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-modal);">

            <!-- Barra Superior Bicolor de La Serena -->
            <div class="muni-top-stripe"></div>

            <!-- Cabecera del Tutorial -->
            <div class="modal-header border-0 pb-0 pt-4 px-4 px-sm-5 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center justify-content-center p-2 rounded-3" style="background: var(--muni-red-tint); border: 1.5px solid var(--muni-red-border); width: 44px; height: 44px;">
                        <img src="{% static 'img/escudo_laserena.svg' %}" alt="Escudo La Serena" style="width: 24px; height: auto;" onerror="this.onerror=null; this.src='{% static 'img/horizontal-color.svg' %}';">
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge" style="background: var(--muni-red); color: #ffffff; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;">
                                GUÍA INTERACTIVA OFICIAL
                            </span>
                            <span class="small text-muted" id="tutorialStepIndicator" style="font-size: 0.78rem; font-weight: 700;">
                                Paso 1 de 7
                            </span>
                        </div>
                        <h5 class="modal-title fw-bold mb-0 mt-0.5" id="modalTutorialSGRLabel" style="color: var(--text-main); font-size: 1.25rem; letter-spacing: -0.02em;">
                            Tutorial de la Plataforma Territorial
                        </h5>
                    </div>
                </div>

                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Cerrar" title="Cerrar Tutorial"></button>
            </div>

            <!-- Barra de Progreso del Tutorial -->
            <div class="px-4 px-sm-5 pt-3">
                <div class="progress" style="height: 6px; border-radius: var(--radius-pill); background-color: #E2E8F0;">
                    <div id="tutorialProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 14.28%; background: linear-gradient(90deg, var(--muni-red) 0%, var(--muni-gold) 100%);" aria-valuenow="14.28" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>

            <!-- Cuerpo del Tutorial (Contenedor Dinámico) -->
            <div class="modal-body p-4 p-sm-5">
                <div id="tutorialStepContent" class="transition-all" style="min-height: 270px;">
                    <!-- Renderizado dinámicamente vía JavaScript -->
                </div>
            </div>

            <!-- Pie de Navegación del Tutorial -->
            <div class="modal-footer border-0 pt-0 pb-4 px-4 px-sm-5 d-flex justify-content-between align-items-center bg-light-subtle">
                <button type="button" id="btnTutorialPrev" onclick="anteriorPasoTutorial()" class="btn-stitch btn-stitch-secondary" disabled>
                    <i class="bi bi-chevron-left"></i>
                    <span>Anterior</span>
                </button>

                <!-- Selector Directo de Pasos (Puntos interactivos) -->
                <div class="d-none d-sm-flex align-items-center gap-1.5" id="tutorialDots">
                    <!-- Puntos generados por JS -->
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-link text-muted text-decoration-none small fw-semibold px-2" data-bs-dismiss="modal">
                        Omitir
                    </button>
                    <button type="button" id="btnTutorialNext" onclick="siguientePasoTutorial()" class="btn-stitch btn-stitch-primary">
                        <span id="btnTutorialNextText">Siguiente</span>
                        <i class="bi bi-chevron-right" id="btnTutorialNextIcon"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
/**
 * Motor del Tutorial Interactivo • SGR La Serena
 * Explica con claridad y pedagogía todas las reglas y módulos esenciales
 */
const tutorialData = [
    {
        paso: 1,
        icono: 'bi-buildings-fill',
        colorIcono: 'var(--muni-red)',
        bgIcono: 'var(--muni-red-tint)',
        titulo: '¡Bienvenido a la Plataforma Territorial SGR!',
        subtitulo: 'Ilustre Municipalidad de La Serena • Operación Territorial',
        resumen: 'Este sistema centraliza y moderniza la gestión de requerimientos y atención ciudadana para las 6 Delegaciones Territoriales de la comuna.',
        puntos: [
            {
                badge: 'Propósito',
                texto: 'Reemplazar las planillas aisladas por un sistema seguro, trazable y auditable en tiempo real.'
            },
            {
                badge: '6 Delegaciones',
                texto: 'Conecta a Centro Histórico, Las Compañías, La Pampa, La Antena, Sector Rural y Avenida del Mar.'
            },
            {
                badge: 'Accesibilidad',
                texto: 'Diseñado bajo estándares de contraste y ergonomía para facilitar el uso por funcionarios y personal de terreno.'
            }
        ],
        urlDestino: null
    },
    {
        paso: 2,
        icono: 'bi-person-lines-fill',
        colorIcono: 'var(--muni-red)',
        bgIcono: 'var(--muni-red-tint)',
        titulo: '1. Padrón Comunal de Vecinos (Módulo CRUD)',
        subtitulo: 'Identificación ciudadana rigurosa y trazabilidad inmutable',
        resumen: 'En este módulo se gestiona la nómina oficial de los vecinos de La Serena que solicitan atenciones o requerimientos comunitarios.',
        puntos: [
            {
                badge: 'Validación de RUT',
                texto: 'El sistema valida automáticamente el algoritmo Módulo 11 del RUT chileno para evitar duplicados o errores de digitación.'
            },
            {
                badge: 'Borrado Lógico Obligatorio',
                texto: '<strong>REGLA CRÍTICA:</strong> Los vecinos nunca se eliminan físicamente de la base de datos. Al desactivar un vecino, se aplica <em>borrado lógico</em> para preservar el historial de atenciones y auditorías de Contraloría.'
            },
            {
                badge: 'Búsqueda Rápida',
                texto: 'Filtra al instante por RUT, nombre completo, teléfono o delegación territorial de residencia.'
            }
        ],
        urlDestino: "{% url 'vecinos:vecinos_list' %}",
        textoBotonDestino: 'Ir al Padrón de Vecinos'
    },
    {
        paso: 3,
        icono: 'bi-geo-alt-fill',
        colorIcono: 'var(--muni-blue)',
        bgIcono: 'var(--muni-blue-tint)',
        titulo: '2. Delegaciones Territoriales y Descentralización',
        subtitulo: 'Operación comunal directa en los territorios de La Serena',
        resumen: 'Cada solicitud vecinal queda adscrita a la jurisdicción de una delegación territorial para una respuesta focalizada.',
        puntos: [
            {
                badge: 'Cobertura 100%',
                texto: 'Permite administrar las 6 delegaciones territoriales con su respectiva jefatura, dirección física y teléfono de contacto.'
            },
            {
                badge: 'Cuadrillas Operativas',
                texto: 'Los funcionarios y cuadrillas de terreno (DISERCO, Aseo, Social) se asignan directamente por delegación territorial.'
            },
            {
                badge: 'Autonomía Territorial',
                texto: 'Permite descentralizar la toma de decisiones y acelerar la resolución de problemas comunitarios.'
            }
        ],
        urlDestino: "{% url 'territorial:delegaciones_list' %}",
        textoBotonDestino: 'Ver Delegaciones Comunales'
    },
    {
        paso: 4,
        icono: 'bi-bullseye',
        colorIcono: 'var(--muni-green)',
        bgIcono: 'var(--muni-green-tint)',
        titulo: '3. Ítems de Metas e Indicadores de Rendimiento',
        subtitulo: 'Control de gestión, metas trimestrales y evaluación continua',
        resumen: 'El sistema permite fijar metas cuantitativas periódicas para medir el cumplimiento de compromisos adquiridos con la comunidad.',
        puntos: [
            {
                badge: 'Metas Trimestrales',
                texto: 'Cada cuadrilla y delegación cuenta con una meta de tickets o faenas fijadas para el ciclo operativo.'
            },
            {
                badge: 'Semáforo de Desempeño',
                texto: 'El sistema calcula el avance porcentual frente a los días hábiles transcurridos para alertar desviaciones a tiempo.'
            },
            {
                badge: 'Reconocimiento',
                texto: 'Registra felicitaciones ciudadanas (+bono) o reclamos por retraso para auditoría de calidad de servicio.'
            }
        ],
        urlDestino: "{% url 'territorial:metas_list' %}",
        textoBotonDestino: 'Ver Ítems de Metas'
    },
    {
        paso: 5,
        icono: 'bi-diagram-3-fill',
        colorIcono: 'var(--muni-gold)',
        bgIcono: 'var(--muni-gold-tint)',
        titulo: '4. Tipos de Atención y Sub-Atenciones Jerárquicas',
        subtitulo: 'De la solicitud del vecino al despacho de la cuadrilla competente',
        resumen: 'Estructura en 2 niveles normalizados para garantizar que ningún requerimiento quede mal clasificado o sin cuadrilla asignada.',
        puntos: [
            {
                badge: 'Macro-Áreas (Tipos)',
                texto: 'Clasifica en pilares operativos clave: <em>DISERCO (Obras y Servicios Comunitarios), DIDECO (Gestión Social), Seguridad Ciudadana y Medio Ambiente</em>.'
            },
            {
                badge: 'Sub-Atenciones Específicas',
                texto: 'Define faenas operativas concretas: <em>Poda de ramas sobre tendido, reposición de luminarias, bacheo de calles, retiro de escombros y camión limpiafosas</em>.'
            },
            {
                badge: 'Despacho Eficiente',
                texto: 'Asigna automáticamente los tiempos de respuesta y materiales técnicos necesarios según la sub-atención elegida.'
            }
        ],
        urlDestino: "{% url 'atenciones:tipo_atencion_list' %}",
        textoBotonDestino: 'Ver Tipos de Atención'
    },
    {
        paso: 6,
        icono: 'bi-shield-lock-fill',
        colorIcono: 'var(--muni-purple)',
        bgIcono: 'var(--muni-purple-tint)',
        titulo: '5. Cuentas de Personal, Roles y Seguridad',
        subtitulo: 'Control de acceso jerárquico y protección de datos municipales',
        resumen: 'Garantiza que cada usuario opere según su responsabilidad funcional, registrando toda actividad en bitácora inmutable.',
        puntos: [
            {
                badge: 'Perfiles Oficiales',
                texto: 'Roles tipificados: <em>Administrador del Sistema, Supervisor de Coordinación, Operador de Cuadrilla y Auditor Territorial</em>.'
            },
            {
                badge: 'Criptografía Segura',
                texto: 'Contraseñas blindadas con algoritmos seguros (PBKDF2/SHA-256). Autenticación con RUT o correo institucional.'
            },
            {
                badge: 'Recuperación Segura',
                texto: 'Incluye flujo institucional de recuperación de clave mediante tokens temporales y verificación por código.'
            }
        ],
        urlDestino: "{% url 'usuarios:usuarios_list' %}",
        textoBotonDestino: 'Ver Cuentas de Usuario'
    },
    {
        paso: 7,
        icono: 'bi-file-earmark-spreadsheet-fill',
        colorIcono: '#107C41',
        bgIcono: 'rgba(16, 124, 65, 0.12)',
        titulo: '6. Reportería Oficial y Respaldos de Base de Datos',
        subtitulo: 'Descarga nativa en Excel (.xlsx) y trazabilidad para Contraloría',
        resumen: 'Herramientas de exportación y respaldo para la rendición de cuentas, fiscalización y toma de decisiones en Alcaldía.',
        puntos: [
            {
                badge: 'Planillas Excel (.xlsx)',
                texto: 'Generación directa de reportes con formato oficial de La Serena: Padrón de Vecinos, Desempeño Territorial, Resumen de Usuarios y Tipos de Atención.'
            },
            {
                badge: 'Respaldos de Datos (Backups)',
                texto: 'Copias de seguridad integrales de la base de datos relacional para garantizar continuidad operativa ante cualquier contingencia.'
            },
            {
                badge: 'Transparencia Total',
                texto: 'Información lista para auditorías internas, informes de gestión alcaldicia y consultas ciudadanas bajo Ley de Transparencia.'
            }
        ],
        urlDestino: "{% url 'dashboard:reportes' %}",
        textoBotonDestino: 'Ir al Centro de Reportes'
    }
];

let tutorialCurrentStep = 1;
const tutorialTotalSteps = tutorialData.length;

function iniciarTutorialSGR() {
    tutorialCurrentStep = 1;
    renderTutorialStep(tutorialCurrentStep);

    const modalEl = document.getElementById('modalTutorialSGR');
    if (modalEl) {
        const modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
        modalInstance.show();
    }
}

function renderTutorialStep(stepNumber) {
    const data = tutorialData[stepNumber - 1];
    if (!data) return;

    // Actualizar Indicador y Barra de Progreso
    const stepIndicator = document.getElementById('tutorialStepIndicator');
    if (stepIndicator) stepIndicator.innerText = `Paso ${data.paso} de ${tutorialTotalSteps}`;

    const progressBar = document.getElementById('tutorialProgressBar');
    if (progressBar) {
        const pct = Math.round((data.paso / tutorialTotalSteps) * 100);
        progressBar.style.width = pct + '%';
        progressBar.setAttribute('aria-valuenow', pct);
    }

    // Renderizar Puntos Navegadores
    const dotsContainer = document.getElementById('tutorialDots');
    if (dotsContainer) {
        let dotsHtml = '';
        for (let i = 1; i <= tutorialTotalSteps; i++) {
            const isActive = i === stepNumber;
            const isCompleted = i < stepNumber;
            dotsHtml += `
                <button type="button" onclick="irAPasoTutorial(${i})"
                    class="btn p-0 rounded-circle border-0 transition-all"
                    style="width: ${isActive ? '22px' : '9px'}; height: 9px; border-radius: ${isActive ? '10px' : '50%'} !important; background-color: ${isActive ? 'var(--muni-red)' : (isCompleted ? 'var(--muni-gold)' : '#CBD5E1')};"
                    title="Ir al Paso ${i}">
                </button>
            `;
        }
        dotsContainer.innerHTML = dotsHtml;
    }

    // Renderizar Contenido
    const contentEl = document.getElementById('tutorialStepContent');
    if (contentEl) {
        let puntosHtml = '';
        data.puntos.forEach(p => {
            puntosHtml += `
                <div class="d-flex align-items-start gap-2.5 p-2.5 rounded-3 mb-2" style="background: #F8FAFC; border: 1px solid var(--border-stitch);">
                    <span class="badge shrink-0" style="background: ${data.colorIcono}; color: #ffffff; font-size: 0.72rem; font-weight: 700; padding: 0.35rem 0.6rem;">
                        ${p.badge}
                    </span>
                    <div style="font-size: 0.85rem; color: var(--text-main); line-height: 1.45;">
                        ${p.texto}
                    </div>
                </div>
            `;
        });

        let botonDestinoHtml = '';
        if (data.urlDestino) {
            botonDestinoHtml = `
                <div class="mt-3 pt-2 border-top d-flex justify-content-end">
                    <a href="${data.urlDestino}" class="btn btn-sm fw-bold d-inline-flex align-items-center gap-1.5" style="background: ${data.bgIcono}; color: ${data.colorIcono}; border: 1px solid ${data.colorIcono}; border-radius: var(--radius-pill);">
                        <i class="bi bi-box-arrow-up-right small"></i>
                        <span>${data.textoBotonDestino || 'Explorar este Módulo'}</span>
                    </a>
                </div>
            `;
        }

        contentEl.innerHTML = `
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="d-flex align-items-center justify-content-center p-3 rounded-4 shrink-0 shadow-xs" style="background: ${data.bgIcono}; color: ${data.colorIcono}; width: 56px; height: 56px;">
                    <i class="bi ${data.icono}" style="font-size: 1.75rem;"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0" style="color: var(--text-main); font-size: 1.25rem; letter-spacing: -0.02em;">
                        ${data.titulo}
                    </h4>
                    <div class="small fw-semibold text-muted" style="font-size: 0.82rem;">
                        ${data.subtitulo}
                    </div>
                </div>
            </div>

            <p class="text-secondary small mb-3 fw-normal" style="font-size: 0.92rem; line-height: 1.5;">
                ${data.resumen}
            </p>

            <div class="mt-2">
                ${puntosHtml}
            </div>

            ${botonDestinoHtml}
        `;
    }

    // Actualizar botones de navegación
    const btnPrev = document.getElementById('btnTutorialPrev');
    if (btnPrev) {
        btnPrev.disabled = (stepNumber === 1);
    }

    const btnNext = document.getElementById('btnTutorialNext');
    const btnNextText = document.getElementById('btnTutorialNextText');
    const btnNextIcon = document.getElementById('btnTutorialNextIcon');

    if (stepNumber === tutorialTotalSteps) {
        if (btnNextText) btnNextText.innerText = 'Finalizar Tutorial';
        if (btnNextIcon) btnNextIcon.className = 'bi bi-check2-circle';
        if (btnNext) btnNext.style.background = 'var(--muni-green)';
    } else {
        if (btnNextText) btnNextText.innerText = 'Siguiente';
        if (btnNextIcon) btnNextIcon.className = 'bi bi-chevron-right';
        if (btnNext) btnNext.style.background = 'var(--muni-red)';
    }
}

function siguientePasoTutorial() {
    if (tutorialCurrentStep < tutorialTotalSteps) {
        tutorialCurrentStep++;
        renderTutorialStep(tutorialCurrentStep);
    } else {
        finalizarTutorialSGR();
    }
}

function anteriorPasoTutorial() {
    if (tutorialCurrentStep > 1) {
        tutorialCurrentStep--;
        renderTutorialStep(tutorialCurrentStep);
    }
}

function irAPasoTutorial(paso) {
    if (paso >= 1 && paso <= tutorialTotalSteps) {
        tutorialCurrentStep = paso;
        renderTutorialStep(tutorialCurrentStep);
    }
}

function finalizarTutorialSGR() {
    const modalEl = document.getElementById('modalTutorialSGR');
    if (modalEl) {
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
    }

    localStorage.setItem('tutorial_sgr_visto_2026', 'true');

    if (typeof Swal !== 'undefined') {
        Swal.fire({
            icon: 'success',
            title: '¡Tutorial Completado con Éxito!',
            html: 'Ya conoces los aspectos fundamentales de la <strong>Plataforma Territorial de La Serena</strong>.<br><small class="text-muted">Puedes reactivar este tutorial en cualquier momento desde el botón superior de la barra de navegación.</small>',
            confirmButtonColor: '#B80003',
            confirmButtonText: 'Comenzar a Trabajar',
            customClass: {
                popup: 'muni-swal-popup'
            }
        });
    }
}

// Iniciar automáticamente si se solicita vía query param ?tutorial=1
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tutorial') === '1') {
        setTimeout(iniciarTutorialSGR, 600);
    }
});
</script>
