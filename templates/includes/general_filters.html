<form method="get" class="scope-period" aria-label="Período del resumen" data-quarter-filter>
    <label for="{{ filter_form.trimestre.id_for_label }}">Trimestre</label>{{ filter_form.trimestre }}
    {% if scope_delegation %}<input type="hidden" name="delegacion" value="{{ scope_delegation.pk }}">{% endif %}
    {% if scope_form.responsable.value %}<input type="hidden" name="responsable" value="{{ scope_form.responsable.value }}">{% endif %}
    <noscript><button class="btn-stitch btn-stitch-secondary" type="submit">Aplicar trimestre</button></noscript>
</form>
{% if filter_form.errors %}<div class="text-danger">{{ filter_form.errors }}</div>{% endif %}
