<!-- Modal Editar Meta Stitch Style -->
                <div class="modal fade" id="editMetaModal{{ m.id }}" tabindex="-1" aria-hidden="true" aria-labelledby="editMetaModal{{ m.id }}Title">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content modal-content-stitch">
                            <div class="modal-header-stitch">
                                <h5 id="editMetaModal{{ m.id }}Title" class="fw-bold mb-0" style="color: var(--text-main); font-size: 1.15rem;">Editar Meta: {{ m.nombre }}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>
                            <form method="POST" data-crud-form novalidate action="{% url 'territorial:metas_edit' m.id %}">
                                {% csrf_token %}
                                <div class="modal-body p-4">
                                    <div class="mb-3">
                                        <label for="editMetaModal{{ m.id }}-nombre" class="form-label small fw-semibold" style="color: var(--text-main);">Nombre de la Meta *</label>
                                        <input type="text" id="editMetaModal{{ m.id }}-nombre" name="nombre" value="{{ m.nombre }}" class="input-stitch" required maxlength="150" data-validate="text" pattern=".*\S.*">
                                    </div>
                                    <div class="mb-3">
                                        <label for="editMetaModal{{ m.id }}-descripcion" class="form-label small fw-semibold" style="color: var(--text-main);">Descripción</label>
                                        <textarea id="editMetaModal{{ m.id }}-descripcion" name="descripcion" class="input-stitch" rows="3">{{ m.descripcion|default:"" }}</textarea>
                                    </div>
                                    <div class="form-check form-switch mt-3 pt-2 border-top" style="border-color: var(--border-stitch) !important;">
                                        <input class="form-check-input" type="checkbox" name="activo" id="activoSwitchMeta{{ m.id }}" {% if m.activo %}checked{% endif %}>
                                        <label class="form-check-label small fw-semibold" for="activoSwitchMeta{{ m.id }}" style="color: var(--text-main);">Meta Activa</label>
                                    </div>
                                </div>
                                <div class="modal-footer-stitch">
                                    <button type="button" class="btn-stitch btn-stitch-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn-stitch btn-stitch-primary">Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
