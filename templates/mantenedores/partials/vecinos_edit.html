
                <div class="modal fade" id="editVecinoModal{{ v.id }}" tabindex="-1" aria-hidden="true" aria-labelledby="editVecinoModal{{ v.id }}Title">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content modal-content-stitch">
                            <div class="modal-header-stitch">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px; border-radius: var(--radius-xs); background: var(--muni-red-tint); color: var(--muni-red);">
                                        <i class="bi bi-pencil-square"></i>
                                    </div>
                                    <h2 id="editVecinoModal{{ v.id }}Title" class="fw-bold mb-0" style="color: var(--text-main); font-size: 1.15rem;">Editar Registro: {{ v.nombre }}</h2>
                                </div>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                            </div>
                            <form method="POST" data-crud-form novalidate action="{% url 'vecinos:vecinos_edit' v.id %}">
                                {% csrf_token %}
                                <div class="modal-body p-4">
                                    <div class="row g-3">
                                        <div class="col-md-7">
                                            <label for="editVecinoModal{{ v.id }}-nombre" class="form-label small fw-semibold" style="color: var(--text-main);">Nombre Completo *</label>
                                            <input type="text" id="editVecinoModal{{ v.id }}-nombre" name="nombre" value="{{ v.nombre }}" class="input-stitch" required maxlength="150" data-validate="text" pattern=".*\S.*">
                                        </div>
                                        <div class="col-md-5">
                                            <label for="editVecinoModal{{ v.id }}-rut" class="form-label small fw-semibold" style="color: var(--text-main);">RUT (opcional)</label>
                                            <input type="text" id="editVecinoModal{{ v.id }}-rut" name="rut" value="{{ v.rut|default:'' }}" class="input-stitch" maxlength="12" data-validate="rut" pattern="[0-9.]+[\-]?[0-9kK]">
                            <div class="form-text">Escribe el RUT completo. Los puntos y el guion se agregan solos.</div>
                                        </div>
                                        <div class="col-md-8">
                                            <label for="editVecinoModal{{ v.id }}-direccion" class="form-label small fw-semibold" style="color: var(--text-main);">Dirección de Residencia (opcional)</label>
                                            <input type="text" id="editVecinoModal{{ v.id }}-direccion" name="direccion" value="{{ v.direccion }}" class="input-stitch" maxlength="255" data-validate="text" pattern=".*\S.*">
                                        </div>
                                        <div class="col-md-4">
                                            <label for="editVecinoModal{{ v.id }}-telefono" class="form-label small fw-semibold" style="color: var(--text-main);">Teléfono de Contacto</label>
                                            <input type="tel" id="editVecinoModal{{ v.id }}-telefono" name="telefono" value="{{ v.telefono|default:'' }}" class="input-stitch" maxlength="20" data-validate="phone" pattern="[+0-9\(\) \-]{8,20}">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="editVecinoModal{{ v.id }}-territorio" class="form-label small fw-semibold" style="color: var(--text-main);">Territorio / Delegación</label>
                                            <select id="editVecinoModal{{ v.id }}-territorio" name="territorio" class="input-stitch">
                                                <option value="">-- Sin Asignar --</option>
                                                {% for terr in territorios %}
                                                <option value="{{ terr.id }}" {% if v.territorio_id == terr.id %}selected{% endif %}>{{ terr.nombre }}{% if not terr.activo %} (inactiva; selecciona una activa){% endif %}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="editVecinoModal{{ v.id }}-tipo_gestion" class="form-label small fw-semibold" style="color: var(--text-main);">Tipo de Gestión *</label>
                                            <select id="editVecinoModal{{ v.id }}-tipo_gestion" name="tipo_gestion" class="input-stitch" required>
                                                <option value="Solicitud" {% if v.tipo_gestion == 'Solicitud' %}selected{% endif %}>Solicitud</option>
                                                <option value="Reclamo" {% if v.tipo_gestion == 'Reclamo' %}selected{% endif %}>Reclamo</option>
                                                <option value="Consulta" {% if v.tipo_gestion == 'Consulta' %}selected{% endif %}>Consulta</option>
                                                <option value="Orientacion" {% if v.tipo_gestion == 'Orientacion' %}selected{% endif %}>Orientación</option>
                                            </select>
                                        </div>
                                        <div class="col-12 mt-3 pt-2 border-top" style="border-color: var(--border-stitch) !important;">
                                            <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" name="activo" id="activoSwitchVec{{ v.id }}" {% if v.activo %}checked{% endif %}>
                                                <label class="form-check-label small fw-semibold" for="activoSwitchVec{{ v.id }}" style="color: var(--text-main);">Vecino(a) Activo en el Padrón</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="modal-footer-stitch">
                                    <button type="button" class="btn-stitch btn-stitch-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn-stitch btn-stitch-primary">Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
