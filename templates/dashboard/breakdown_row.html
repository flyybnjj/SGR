<tr><th scope="row">{% if user.is_superuser %}<a href="{% url 'dashboard:inicio' %}?delegacion={{ row.id }}&amp;trimestre={{ period_code }}">{{ row.nombre }}</a>{% else %}{{ row.nombre }}{% endif %}</th><td>{{ row.atenciones }}</td><td>{{ row.actividades }}</td><td>{{ row.pendientes }}</td><td>{{ row.realizadas }}</td><td>{% if row.cumplimiento != None %}<div class="goal-progress"><progress max="100" value="{{ row.barra }}" aria-label="Cumplimiento de {{ row.nombre }}">{{ row.cumplimiento }}%</progress><span>{{ row.cumplimiento }}%</span></div>{% else %}<span class="text-secondary">Sin metas asignadas</span>{% endif %}</td></tr>
