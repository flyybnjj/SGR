{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#B80003">
    <title>Acceso restringido | La Serena</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/escudo_laserena.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/muni-laserena.css' %}?v=20261004-delegation-theme">
    <link rel="stylesheet" href="{% static 'css/municipal-ui.css' %}?v=20261004-delegation-theme">
    <link rel="stylesheet" href="{% static 'css/municipal-auth.css' %}?v=20261018-soft-glass">
</head>
<body class="municipal-auth">
    <main class="auth-restricted-card">
        <img src="{% static 'img/horizontal-color.svg' %}" width="10153" height="2784" alt="Municipalidad de La Serena" class="login-logo-img">
        <h1 class="auth-title">Acceso restringido</h1>
        <p>Tu perfil no tiene permiso para realizar esta operación. Solicita al administrador que revise tu rol y delegación.</p>
        <a class="btn-auth-primary d-inline-flex align-items-center justify-content-center text-decoration-none" href="{% url 'usuarios:logout' %}">Volver al inicio de sesión</a>
    </main>
</body>
</html>
